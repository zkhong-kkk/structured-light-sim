    <marker id="dim-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10" fill="none" stroke="#555" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#555}.panel{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:700}.note{font-size:13px;fill:#444}.coord{font-size:13px;font-family:Consolas,"Microsoft YaHei",monospace}.frame{fill:#fff;stroke:#b7b7b7;stroke-width:1.5}.camera{fill:#f5f5f5;stroke:#111;stroke-width:2}.lens{fill:#fff;stroke:#111;stroke-width:2}.ray{fill:none;stroke:#555;stroke-width:1.5;stroke-dasharray:7 5}.centerline{fill:none;stroke:#aaa;stroke-width:1;stroke-dasharray:8 5}.dimension{fill:none;stroke:#555;stroke-width:1.2;marker-start:url(#dim-arrow);marker-end:url(#dim-arrow)}.extension{fill:none;stroke:#888;stroke-width:1}.axis{fill:none;stroke:#333;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
